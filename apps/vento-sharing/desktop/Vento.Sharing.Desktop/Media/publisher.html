<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vento Sharing · Transmitir tela</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#f4f7fb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(760px,100%);background:#131e30;border:1px solid #2b3c55;border-radius:18px;padding:28px;box-sizing:border-box}
    h1{margin:6px 0 12px;font-size:26px}p{color:#bbcbde;line-height:1.5}
    .label{color:#48c4d9;font-size:12px;font-weight:700;letter-spacing:.08em}
    video{width:100%;aspect-ratio:16/9;background:#090e18;border-radius:12px;object-fit:contain;margin:12px 0}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font:inherit;font-weight:600}
    button:disabled{opacity:.55;cursor:wait}
    #start{background:#42b4c8;color:#091622}#stop{background:#2b3c55;color:white}
    #status{min-height:1.5em}
  </style>
</head>
<body>
  <main>
    <span class="label">VENTO SHARING · DESKTOP</span>
    <h1>Transmitir tela</h1>
    <p>Escolha o monitor ou a janela na próxima etapa. O microfone e o áudio do sistema permanecem desligados, inclusive a conversa no Discord.</p>
    <video id="preview" autoplay muted playsinline></video>
    <div class="actions">
      <button id="start" type="button" disabled>Selecionar tela</button>
      <button id="stop" type="button" disabled>Parar transmissão</button>
    </div>
    <p id="status" role="status">Conectando à sala…</p>
  </main>
  <script type="application/json" id="connection">__CONNECTION__</script>
  <script src="publisher.js" defer></script>
</body>
</html>
